
name: Selenium Java Tests

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1: Execute Selenium tests
  selenium-test:
    name: Execute Selenium Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify Java, Maven and Chrome
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          java -version
          mvn -version
          "$CHROME_BIN" --version

      - name: Compile Selenium project
        run: mvn -B clean test-compile

      - name: Execute Selenium tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          MAVEN_OPTS: -Dheadless=true
        run: |
          mvn -B \
            -Dexec.mainClass=com.example.tests.LocalLoginTest \
            -Dexec.classpathScope=test \
            exec:java

  # JOB 2: Build and publish Docker image
  build-and-publish-docker:
    name: Build and Publish Docker Image

    needs: selenium-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/selenium-testng-automation:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/selenium-testng-automation:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
