
name: Selenium Java Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify Java, Maven and Chrome
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          java -version
          mvn -version
          "$CHROME_BIN" --version

      - name: Compile Selenium project
        run: mvn -B clean test-compile

      - name: Execute Selenium tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          MAVEN_OPTS: -Dheadless=true
        run: |
          mvn -B \
            -Dexec.mainClass=com.example.tests.LocalLoginTest \
            -Dexec.classpathScope=test \
            exec:java
